<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      background: #0a0a0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .card {
      background: linear-gradient(135deg, #14141f 0%, #0d0d15 100%);
      border-radius: 24px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #c62828, #ff3b3b);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    h2 {
      color: white;
      font-size: 20px;
      font-weight: 600;
    }
    .badge {
      background: rgba(255,255,255,0.05);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      color: #888;
      margin-left: auto;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      color: #888;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: block;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a24;
      border: 1.5px solid #2a2a35;
      border-radius: 14px;
      color: white;
      font-size: 14px;
      font-family: monospace;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #c62828;
      box-shadow: 0 0 0 3px rgba(198,40,40,0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #c62828, #ff3b3b);
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s;
      margin-bottom: 20px;
    }
    button:hover {
      transform: translateY(-1px);
    }
    .result {
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .result.banned {
      background: rgba(198,40,40,0.15);
      border: 1px solid rgba(198,40,40,0.3);
    }
    .result.clean {
      background: rgba(46,125,50,0.1);
      border: 1px solid rgba(46,125,50,0.3);
    }
    .result-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .result-text {
      font-weight: 600;
      font-size: 15px;
      color: white;
    }
    .result-sub {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }
    .stats {
      background: #1a1a24;
      padding: 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
    .examples {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .examples span {
      font-size: 11px;
      color: #555;
      cursor: pointer;
      transition: color 0.2s;
    }
    .examples span:hover {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="icon">🚫</div>
    <h2>РКН Чекер</h2>
    <div class="badge">реестр</div>
  </div>

  <div class="input-group">
    <label>🔍 ПРОВЕРИТЬ САЙТ</label>
    <input type="text" id="siteInput" placeholder="rutracker.org">
  </div>

  <button id="checkBtn">Проверить</button>

  <div id="result" style="display: none;"></div>

  <div class="examples">
    <span id="ex1">krakenfiles.com</span>
    <span id="ex2">rutracker.org</span>
    <span id="ex3">google.com</span>
  </div>

  <div class="stats" id="stats">
    📋 Загрузка списка...
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
