<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Доступ ограничен по решению РКН</title>
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { color: #c62828; font-size: 32px; }
    .site { background: #f5f5f5; padding: 15px; border-radius: 10px; margin: 20px 0; font-weight: bold; }
    .seal { font-size: 80px; }
  </style>
</head>
<body>
<div class="container">
  <div class="seal">🚫</div>
  <h1>ДОСТУП ОГРАНИЧЕН</h1>
  <p>Сайт</p>
  <div class="site" id="siteName">loading...</div>
  <p>внесён в реестр запрещённых информационных ресурсов РФ</p>
  <p><strong>По решению РКН</strong></p>
  <small style="color:gray">Симуляция блокировки | Учебное расширение</small>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('siteName').innerText = params.get('site') || 'неизвестный сайт';
</script>
</body>
</html>
